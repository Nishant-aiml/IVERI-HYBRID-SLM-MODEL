<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <rect width="600" height="500" fill="#ffffff" rx="10"/>
  <ellipse cx="300" cy="50" rx="100" ry="30" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="300" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">Start Byte Processing</text>
  
  <path d="M 300 80 L 300 130" stroke="#0288d1" stroke-width="2"/>
  
  <rect x="200" y="130" width="200" height="60" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="6"/>
  <text x="300" y="165" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#f57f17">Compute H(b_t)</text>
  
  <path d="M 300 190 L 300 240" stroke="#fbc02d" stroke-width="2"/>
  
  <polygon points="300,240 420,290 300,340 180,290" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2"/>
  <text x="300" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a148c">H(b_t) &lt; τ ?</text>
  
  <path d="M 180 290 L 100 290 L 100 390" stroke="#ab47bc" stroke-width="2"/>
  <text x="135" y="280" font-family="Arial" font-size="11" fill="#4a148c">Yes (Low Entropy)</text>
  
  <rect x="20" y="390" width="160" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="100" y="425" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">Route to k=1 Expert</text>
  
  <path d="M 420 290 L 500 290 L 500 390" stroke="#ab47bc" stroke-width="2"/>
  <text x="465" y="280" font-family="Arial" font-size="11" fill="#4a148c">No (High Entropy)</text>
  
  <rect x="420" y="390" width="160" height="60" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="6"/>
  <text x="500" y="425" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#b71c1c">Route to k=4 Experts</text>
</svg>
